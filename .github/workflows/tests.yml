name: tests

on:
  push:
    branches: [main]
    paths:
      - "composer.json"
      - "**.php"
      - "phpunit.xml.dist"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "composer.json"
      - "**.php"
      - "phpunit.xml.dist"
      - ".github/workflows/tests.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  run-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [8.6, 8.5, 8.4, 8.3, 8.2]

    name: P${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v4

      - name: Execute tests
        run: composer test
