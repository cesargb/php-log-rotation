name: static analysis

on:
  push:
    branches: [main]
    paths:
      - "composer.json"
      - "**.php"
      - "phpstan.neon.dist"
      - ".github/workflows/static-analysis.yml"

  pull_request:
    paths:
      - "composer.json"
      - "**.php"
      - "phpstan.neon.dist"
      - ".github/workflows/static-analysis.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpstan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: "8.5"
          coverage: none

      - name: Install composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda

      - name: Run analyse phpstan
        run: vendor/bin/phpstan analyse --error-format github --no-progress
